services:
  - type: web
    name: gofinances-api
    runtime: node
    plan: starter
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm run api:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
