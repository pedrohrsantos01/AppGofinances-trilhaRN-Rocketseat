name: Nightly Regression

on:
  schedule:
    - cron: "0 4 * * *" # 4am UTC daily
  workflow_dispatch:

jobs:
  regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Full test suite with coverage
        run: npm run test:coverage:ci -- --verbose

      - name: API regression tests
        run: npm run test:api -- --ci --no-coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  detox-regression:
    name: Detox Android Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and run full Detox suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: Pixel_4_API_33
          script: npm run test:e2e:build && npm run test:e2e
