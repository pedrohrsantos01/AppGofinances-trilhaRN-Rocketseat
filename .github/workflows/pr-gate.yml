name: PR Gate

on:
  pull_request:
    branches: [develop, master]

jobs:
  quality:
    name: Typecheck, Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --ci --no-coverage

      - name: Integration tests
        run: npm run test:integration -- --ci --no-coverage

      - name: API tests
        run: npm run test:api -- --ci --no-coverage

      - name: Coverage report
        run: npm run test:coverage:ci

  detox-smoke:
    name: Detox Smoke Android
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and run Detox auth smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: Pixel_4_API_33
          script: npm run test:e2e:build && npm run test:e2e:smoke
